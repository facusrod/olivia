services:
  # MongoDB para Olivia
  mongodb:
    image: mongo:7.0
    container_name: olivia-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  # PostgreSQL para Odoo
  odoo-db:
    image: postgres:13
    container_name: olivia-odoo-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo-dev-password
    volumes:
      - odoo_db_data:/var/lib/postgresql/data

  # Odoo 18
  odoo:
    image: odoo:18.0
    container_name: olivia-odoo
    restart: unless-stopped
    depends_on:
      - odoo-db
    ports:
      - "8069:8069"
    volumes:
      - odoo_web_data:/var/lib/odoo
      - ./odoo-addons:/mnt/extra-addons
      - ./odoo.conf:/etc/odoo/odoo.conf
    environment:
      - HOST=odoo-db
      - USER=odoo
      - PASSWORD=odoo-dev-password

volumes:
  mongodb_data:
  odoo_db_data:
  odoo_web_data:
